name: Feature Request
description: Request a new feature for EventPro
title: "[Feature]: "
labels: ["type:feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature for EventPro!

  - type: input
    id: issue-id
    attributes:
      label: Issue ID
      description: If this is part of the roadmap, provide the issue ID (e.g., EP-001)
      placeholder: EP-XXX
    validations:
      required: false

  - type: dropdown
    id: phase
    attributes:
      label: Development Phase
      description: Which phase does this feature belong to?
      options:
        - Phase 1: Foundation (Weeks 1-6)
        - Phase 2: Core Modules (Weeks 7-16)
        - Phase 3: Extended Modules (Weeks 17-24)
        - Phase 4: Customization (Weeks 25-30)
        - Phase 5: Launch (Weeks 31-36)
        - Not part of roadmap
    validations:
      required: true

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does this feature relate to?
      options:
        - Core Architecture
        - Venue Management
        - Booking System
        - Payment Tracking
        - Client Portal
        - Admin Interface
        - API
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: What is the priority level?
      options:
        - Critical - Must be completed, blocks other work
        - High - Important feature, should be completed
        - Medium - Nice to have, can be deferred if needed
        - Low - Optional enhancement
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Provide a clear and concise description of the feature
      placeholder: Describe what you want to achieve...
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List the criteria that must be met for this feature to be complete
      placeholder: |
        - [ ] Criterion 1
        - [ ] Criterion 2
        - [ ] Criterion 3
    validations:
      required: true

  - type: input
    id: estimate
    attributes:
      label: Time Estimate
      description: Estimated time to complete this feature
      placeholder: e.g., 2 days, 1 week
    validations:
      required: false

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: List any issues or features that must be completed before this one
      placeholder: |
        - EP-001
        - EP-002
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Add any other context, mockups, or screenshots about the feature request
    validations:
      required: false
