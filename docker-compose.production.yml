services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: eventpro-app
    restart: unless-stopped
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
    env_file:
      - .env.production
    volumes:
      - storage_data:/var/www/html/storage/app
      - public_storage:/var/www/html/public/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventpro-network

  nginx:
    image: nginx:alpine
    container_name: eventpro-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - .:/var/www/html:ro
      - public_storage:/var/www/html/public/storage:ro
      - ./docker/nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - app
    networks:
      - eventpro-network

  mysql:
    image: mysql:8.0
    container_name: eventpro-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventpro-network

  redis:
    image: redis:7-alpine
    container_name: eventpro-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventpro-network

  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: eventpro-queue
    restart: unless-stopped
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env.production
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - eventpro-network

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: eventpro-scheduler
    restart: unless-stopped
    command: sh -c "while true; do php artisan schedule:run; sleep 60; done"
    env_file:
      - .env.production
    depends_on:
      - app
    networks:
      - eventpro-network

networks:
  eventpro-network:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
  public_storage:
  certbot_certs:
